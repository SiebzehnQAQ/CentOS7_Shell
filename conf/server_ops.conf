# 项目存储目录
# 根目录
BASE_DIR=/opt/server_ops
#巡检报告
REPORT_DIR=/opt/server_ops/reports
#备份包
BACKUP_DIR=/opt/server_ops/backups
#恢复测试文件
RESTORE_DIR=/opt/server_ops/restore
#运行日志
LOG_DIR=/opt/server_ops/logs
LOG_FILE=/opt/server_ops/logs/ops.log

# 巡检阈值，单位为百分比 cpu 内存 磁盘
CPU_LIMIT=80
MEM_LIMIT=80
DISK_LIMIT=80

# 大文件检查  位置，大小
LARGE_FILE_DIR=/var/log
LARGE_FILE_SIZE_MB=100

# 文件保留天数
RETENTION_DAYS=7

